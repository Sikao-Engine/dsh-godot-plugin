# Release pipeline: push a v* tag -> build both engine workers -> stage -> pack
# -> GitHub Release with the tarball, SHA256SUMS.txt, and CHANGELOG-derived notes.
#
# Local-equivalent path (same scripts): pnpm run release:pack && node scripts/publish.mjs github
#
# Secrets:
#   GH_SUBMODULE_PAT (optional) - PAT that can read the godot fork when it is private.
#                                 Without it the submodule URL is rewritten to plain HTTPS,
#                                 which works for public forks.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.3.0
        required: true
        type: string

env:
  SUBMODULE_PAT: ${{ secrets.GH_SUBMODULE_PAT }}

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 240 # scons full builds are slow on 4-core runners
    steps:
      - name: Rewrite SSH submodule URL to HTTPS (sailing-innocent/godot)
        shell: bash
        run: |
          if [ -n "$SUBMODULE_PAT" ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "git@github.com:"
          else
            git config --global url."https://github.com/".insteadOf "git@github.com:"
          fi

      - name: Checkout (with godot submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve release version and verify tag == package.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Release tag: $TAG, package.json: $PKG_VERSION"
          if [ "$TAG" != "v$PKG_VERSION" ]; then
            echo "::error ::Tag $TAG does not match package.json version $PKG_VERSION. Run: node scripts/publish.mjs version $TAG"
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 'Pin link: devDependencies for a standalone checkout'
        run: node scripts/ci-pin-deps.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install scons
        run: python -m pip install scons

      - name: Restore scons cache
        id: scons-cache
        uses: actions/cache/restore@v4
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ hashFiles('godot/.git/HEAD') }}
          restore-keys: scons-${{ runner.os }}-

      - name: Build worker (template_release)
        run: pnpm run godot:build -- cache_path="${{ github.workspace }}/.scons-cache" cache_limit=8

      - name: Build editor worker
        run: pnpm run godot:build:editor -- cache_path="${{ github.workspace }}/.scons-cache" cache_limit=8

      - name: Save scons cache (keyed by godot submodule commit)
        if: always() && steps.scons-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .scons-cache
          key: scons-${{ runner.os }}-${{ hashFiles('godot/.git/HEAD') }}

      - name: Stage both workers + runtime manifests
        run: pnpm run release:stage

      - name: Check (typecheck + build + tests)
        run: pnpm run check

      - name: Advisory protocol verify (GPU-less runners usually fail here)
        continue-on-error: true
        run: |
          pnpm run godot:verify
          pnpm run godot:verify:editor

      - name: Pack tarball
        run: pnpm run release:pack

      - name: Upload tarball as workflow artifact (debug/retention)
        uses: actions/upload-artifact@v4
        with:
          name: dsh-godot-plugin-${{ env.RELEASE_TAG }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release (tarball + SHA256SUMS + CHANGELOG notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish.mjs github
